<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 900 210' width='900' height='210' font-family='-apple-system, Segoe UI, Helvetica, Arial, sans-serif'><rect width='900' height='210' rx='14' fill='#fafafb'/><defs><marker id='a' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#6b6f7a'/></marker></defs><rect x='24' y='34' width='186' height='70' rx='10' fill='#3b3e48'/><text x='40' y='63.0' dominant-baseline='middle' font-size='15' font-weight='600' fill='#ffffff'>Stock firmware</text><text x='40' y='82.0' dominant-baseline='middle' font-size='12' fill='rgba(255,255,255,0.85)'>as it ships</text><rect x='246' y='34' width='186' height='70' rx='10' fill='#5b6cf0'/><text x='262' y='63.0' dominant-baseline='middle' font-size='15' font-weight='600' fill='#ffffff'>Installer</text><text x='262' y='82.0' dominant-baseline='middle' font-size='12' fill='rgba(255,255,255,0.85)'>runs once, from RAM</text><rect x='468' y='34' width='186' height='70' rx='10' fill='#5b6cf0'/><text x='484' y='63.0' dominant-baseline='middle' font-size='15' font-weight='600' fill='#ffffff'>Bootloader</text><text x='484' y='82.0' dominant-baseline='middle' font-size='12' fill='rgba(255,255,255,0.85)'>USB DFU, for good</text><rect x='690' y='34' width='186' height='70' rx='10' fill='#ff5a36'/><text x='706' y='63.0' dominant-baseline='middle' font-size='15' font-weight='600' fill='#ffffff'>Your firmware</text><text x='706' y='82.0' dominant-baseline='middle' font-size='12' fill='rgba(255,255,255,0.85)'>GrooveBox, any sketch</text><line x1='212' y1='69' x2='242' y2='69' stroke='#6b6f7a' stroke-width='2' marker-end='url(#a)'/><line x1='434' y1='69' x2='464' y2='69' stroke='#6b6f7a' stroke-width='2' marker-end='url(#a)'/><line x1='656' y1='69' x2='686' y2='69' stroke='#6b6f7a' stroke-width='2' marker-end='url(#a)'/><text x='24' y='140' font-size='12.5' fill='#24262c'><tspan font-weight='600'>1  USB-MIDI</tspan><tspan fill='#6b6f7a'>  —  install_from_stock.py writes the installer and the bootloader into free flash over USB-MIDI, then repoints the boot entry</tspan></text><text x='24' y='162' font-size='12.5' fill='#24262c'><tspan font-weight='600'>2  power cycle</tspan><tspan fill='#6b6f7a'>  —  the installer copies the bootloader to 0x1000 and gives the boot entry back</tspan></text><text x='24' y='184' font-size='12.5' fill='#24262c'><tspan font-weight='600'>3  DFU upload</tspan><tspan fill='#6b6f7a'>  —  dfu-util / Arduino upload: from then on, no tools, no opening the case</tspan></text></svg>

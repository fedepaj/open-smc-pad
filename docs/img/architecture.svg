<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 900 470' width='900' height='470' font-family='-apple-system, Segoe UI, Helvetica, Arial, sans-serif'><rect width='900' height='470' rx='14' fill='#fafafb'/><defs><marker id='a' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#6b6f7a'/></marker></defs><rect x='24' y='24' width='600' height='62' rx='10' fill='#ff5a36'/><text x='40' y='49.0' dominant-baseline='middle' font-size='15' font-weight='600' fill='#ffffff'>Sketches</text><text x='40' y='68.0' dominant-baseline='middle' font-size='12' fill='rgba(255,255,255,0.85)'>GrooveBox sequencer · SMCPadStock (the factory behaviour) · yours</text><rect x='24' y='96' width='600' height='62' rx='10' fill='#f39c12'/><text x='40' y='121.0' dominant-baseline='middle' font-size='15' font-weight='600' fill='#ffffff'>Arduino core + libraries</text><text x='40' y='140.0' dominant-baseline='middle' font-size='12' fill='rgba(255,255,255,0.85)'>SMCPad · MIDIUSB · BLEMIDI · ArduinoBLE · EEPROM · Serial · String</text><rect x='24' y='168' width='600' height='62' rx='10' fill='#2ecc71'/><text x='40' y='193.0' dominant-baseline='middle' font-size='15' font-weight='600' fill='#ffffff'>Runtime  (smcpad_rt.h)</text><text x='40' y='212.0' dominant-baseline='middle' font-size='12' fill='rgba(255,255,255,0.85)'>pads 340 Hz + pressure · knobs · LEDs · µs timing · USB-MIDI · BLE GATT · flash</text><rect x='24' y='240' width='600' height='62' rx='10' fill='#1fa2c9'/><text x='40' y='265.0' dominant-baseline='middle' font-size='15' font-weight='600' fill='#ffffff'>JieLi SDK  +  TinyUSB</text><text x='40' y='284.0' dominant-baseline='middle' font-size='12' fill='rgba(255,255,255,0.85)'>OS, Bluetooth stack (precompiled core)  ·  our BR25 USB driver</text><rect x='24' y='312' width='600' height='62' rx='10' fill='#5b6cf0'/><text x='40' y='337.0' dominant-baseline='middle' font-size='15' font-weight='600' fill='#ffffff'>Bootloader</text><text x='40' y='356.0' dominant-baseline='middle' font-size='12' fill='rgba(255,255,255,0.85)'>USB DFU · self-update · falls back to DFU after a crash loop</text><rect x='24' y='384' width='600' height='62' rx='10' fill='#3b3e48'/><text x='40' y='409.0' dominant-baseline='middle' font-size='15' font-weight='600' fill='#ffffff'>SMC-PAD: JieLi AC6966C</text><text x='40' y='428.0' dominant-baseline='middle' font-size='12' fill='rgba(255,255,255,0.85)'>16 RGB pads · 8 encoders · 10 buttons · USB-C · Bluetooth 5 · MIDI out</text><text x='660' y='34' font-size='12' font-weight='600' fill='#6b6f7a' letter-spacing='1'>ON YOUR COMPUTER</text><rect x='660' y='48' width='216' height='72' rx='10' fill='#fff' stroke='#d9dbe1'/><text x='676' y='78' font-size='14' font-weight='600' fill='#24262c'>Arduino IDE / arduino-cli</text><text x='676' y='99' font-size='11.5' fill='#6b6f7a'>upload over DFU (1200-baud touch)</text><rect x='660' y='134' width='216' height='72' rx='10' fill='#fff' stroke='#d9dbe1'/><text x='676' y='164' font-size='14' font-weight='600' fill='#24262c'>Ableton Live · any DAW</text><text x='676' y='185' font-size='11.5' fill='#6b6f7a'>USB-MIDI · BLE-MIDI · MIDI clock</text><rect x='660' y='220' width='216' height='72' rx='10' fill='#fff' stroke='#d9dbe1'/><text x='676' y='250' font-size='14' font-weight='600' fill='#24262c'>SMC_PAD Live script</text><text x='676' y='271' font-size='11.5' fill='#6b6f7a'>Drum Rack colours, transport</text><rect x='660' y='306' width='216' height='72' rx='10' fill='#fff' stroke='#d9dbe1'/><text x='676' y='336' font-size='14' font-weight='600' fill='#24262c'>Emulator</text><text x='676' y='357' font-size='11.5' fill='#6b6f7a'>the same sketch, on the desk → GIFs</text><line x1='642' y1='60' x2='642' y2='380' stroke='#c4c7cf' stroke-width='2' stroke-dasharray='5 5'/><text x='660' y='420' font-size='11.5' fill='#6b6f7a'>⟵  over USB-C and Bluetooth</text></svg>
